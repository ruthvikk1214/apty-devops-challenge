replicaCount: 1
image:
  repository: apty-static
  tag: latest
  pullPolicy: IfNotPresent
env: Dev   # Default – can be overridden with --set env=Prod
service:
  type: ClusterIP
  port: 80
resources:
  limits:
    cpu: "200m"
    memory: "256Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"
readinessProbe:
  httpGet:
    path: "/"
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80