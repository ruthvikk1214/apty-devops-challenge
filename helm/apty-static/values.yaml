replicaCount: 1
image:
  repository: apty-static
  tag: latest
  pullPolicy: IfNotPresent

env: "Dev"
commitSha: "local-build"

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: "200m"
    memory: "256Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"
readinessProbe:
  httpGet:
    path: "/"
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  minReplicas: 1
  targetCPUUtilizationPercentage: 80