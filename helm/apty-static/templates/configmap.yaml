apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apty-static.fullname" . }}-html
  labels:
    {{- include "apty-static.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Environment Banner</title>
      <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f6f8; }
        .banner { padding: 24px 48px; border-radius: 8px; font-size: 2rem; font-weight: bold; color: #fff; background: {{ if eq .Values.env "Prod" }}#d32f2f{{ else }}#0288d1{{ end }}; }
      </style>
    </head>
    <body>
      <div class="banner">Environment: {{ .Values.env }}</div>
    </body>
    </html>