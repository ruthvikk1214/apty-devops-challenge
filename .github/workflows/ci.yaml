name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./Terraform/root

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Security Analysis (Bonus)
  # -------------------------------------------------------------
  security-scan:
    name: Security Lint (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Static Code Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          directory: Terraform/
          framework: terraform
          soft_fail: true

  # -------------------------------------------------------------
  # Job 2: Terraform Formatting, Validation & Multi-Env Plan
  # -------------------------------------------------------------
  terraform-ci:
    name: Terraform Format & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../
        # Runs from Terraform/ to cover root + modules

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Dev)
        run: terraform plan -var-file="env-dev.tfvars" -no-color

      - name: Terraform Plan (Prod)
        run: terraform plan -var-file="env-prod.tfvars" -no-color

  # -------------------------------------------------------------
  # Job 3: Bonus — Terraform Apply (gated on main, manual approval)
  # -------------------------------------------------------------
  terraform-apply:
    name: Terraform Apply (Dev)
    needs: [terraform-ci, security-scan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production          # Requires manual approval in GitHub Settings → Environments
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply (Dev)
        run: terraform apply -auto-approve -var-file="env-dev.tfvars"

  # -------------------------------------------------------------
  # Job 4: Helm Lint & Kind Integration Test (Bonus)
  # -------------------------------------------------------------
  helm-and-kind-ci:
    name: Helm Lint & Kind Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: helm lint ./helm/apty-static

      - name: Create Ephemeral Kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: kind-ci-test

      - name: Build Base Docker Image
        run: docker build -t apty-static:latest ./Docker

      - name: Load Image into Kind Cluster
        run: kind load docker-image apty-static:latest --name kind-ci-test

      - name: Test Helm Deploy (Dev Release)
        run: |
          helm install test-dev ./helm/apty-static \
            --set env=Dev \
            --set commitSha=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent
          kubectl rollout status deployment/test-dev-apty-static --timeout=60s

      - name: Test Helm Deploy (Prod Release)
        run: |
          helm install test-prod ./helm/apty-static \
            --set env=Prod \
            --set commitSha=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent
          kubectl rollout status deployment/test-prod-apty-static --timeout=60s