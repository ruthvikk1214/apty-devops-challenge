name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Security Analysis (Bonus Scope)
  # -------------------------------------------------------------
  security-scan:
    name: Security Lint (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Static Code Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          directory: Terraform/
          framework: terraform
          soft_fail: true

  # -------------------------------------------------------------
  # Job 2: Terraform Formatting, Validation & Multi-Env Plan
  # -------------------------------------------------------------
  terraform-ci:
    name: Terraform Format & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Terraform/root
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Dev Environment)
        run: terraform plan -var-file="env-dev.tfvars" -var="commit_sha=${{ github.sha }}" -no-color

      - name: Terraform Plan (Prod Environment)
        run: terraform plan -var-file="env-prod.tfvars" -var="commit_sha=${{ github.sha }}" -no-color

  # -------------------------------------------------------------
  # Job 3: Helm Lint, Ephemeral Kind Cluster & In-Cluster Rollout Test (Bonus Scope)
  # -------------------------------------------------------------
  helm-and-kind-ci:
    name: Helm Lint & Kind Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: helm lint ./helm/apty-static

      - name: Create Ephemeral Kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: kind-ci-test

      - name: Build Base Docker Image
        run: docker build -t apty-static:latest ./Docker

      - name: Load Image into Kind Cluster
        run: kind load docker-image apty-static:latest --name kind-ci-test

      - name: Test Helm Deploy (Dev Release)
        run: |
          helm install test-dev ./helm/apty-static \
            --set env=Dev \
            --set commitSha=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent
          kubectl rollout status deployment/test-dev-apty-static --timeout=60s

      - name: Test Helm Deploy (Prod Release)
        run: |
          helm install test-prod ./helm/apty-static \
            --set env=Prod \
            --set commitSha=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent
          kubectl rollout status deployment/test-prod-apty-static --timeout=60s